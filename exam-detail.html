<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== استایل‌های صفحه آزمون ===== */
        .exam-page {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .exam-box {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }
        .exam-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }
        .timer {
            background: var(--bg-body);
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 700;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .timer.warning {
            background: rgba(239, 68, 68, 0.15);
            color: #dc2626;
            border-color: #dc2626;
        }
        .info-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            font-size: 14px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .info-bar span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .info-bar i {
            color: var(--primary-color);
        }
        .progress-bar {
            height: 6px;
            background: var(--bg-body);
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            border-radius: 10px;
            transition: width 0.4s;
        }
        .question {
            display: none;
        }
        .question.active {
            display: block;
        }
        .question-number {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .option:hover {
            border-color: var(--primary-color);
            background: var(--bg-card-hover);
        }
        .option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }
        .option.selected {
            border-color: var(--primary-color);
            background: rgba(37, 99, 235, 0.05);
        }
        .option .label {
            font-weight: 700;
            color: var(--text-muted);
            min-width: 28px;
        }
        .option .text {
            color: var(--text-primary);
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-prev {
            background: var(--bg-body);
            color: var(--text-secondary);
            border: 2px solid var(--border-color) !important;
        }
        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-prev:hover:not(:disabled) {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .btn-next {
            background: var(--primary-color);
            color: white;
        }
        .btn-next:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-submit {
            background: #10b981;
            color: white;
        }
        .btn-submit:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }
        .counter {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        /* ===== نتیجه ===== */
        .result-box {
            display: none;
            text-align: center;
            padding: 30px 0;
        }
        .result-box.active {
            display: block;
        }
        .result-icon {
            font-size: 64px;
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .result-score {
            font-size: 48px;
            font-weight: 900;
            color: var(--primary-color);
            margin: 10px 0;
        }
        .result-details {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .result-details div {
            background: var(--bg-body);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .result-details .correct {
            color: #10b981;
            font-weight: 700;
        }
        .result-details .wrong {
            color: #ef4444;
            font-weight: 700;
        }
        .result-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .result-actions a,
        .result-actions button {
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-size: 14px;
            transition: var(--transition);
        }
        .btn-retry {
            background: var(--bg-body);
            color: var(--text-secondary);
            border: 2px solid var(--border-color) !important;
        }
        .btn-retry:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .btn-dashboard {
            background: var(--primary-color);
            color: white;
        }
        .btn-dashboard:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-rewards {
            background: #f59e0b;
            color: white;
        }
        .btn-rewards:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        /* ===== دارک مود ===== */
        body.dark-theme .exam-box {
            background: #1e293b;
            border-color: #334155;
        }
        body.dark-theme .option {
            border-color: #334155;
        }
        body.dark-theme .option:hover {
            background: #0f172a;
        }
        body.dark-theme .option.selected {
            background: rgba(37, 99, 235, 0.15);
        }
        body.dark-theme .result-details div {
            background: #0f172a;
            border-color: #334155;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 500px) {
            .exam-box {
                padding: 16px;
            }
            .question-text {
                font-size: 17px;
            }
            .exam-header h1 {
                font-size: 17px;
            }
            .actions {
                flex-direction: column;
                align-items: center;
            }
            .actions button {
                width: 100%;
                justify-content: center;
            }
            .result-actions {
                flex-direction: column;
            }
            .result-actions a,
            .result-actions button {
                width: 100%;
                justify-content: center;
            }
            .result-score {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <main class="exam-page">
        <div class="exam-box">

            <!-- ===== هدر ===== -->
            <div class="exam-header">
                <h1 id="examTitle">آزمون ریاضی</h1>
                <div class="timer" id="timerDisplay">15:00</div>
            </div>

            <!-- ===== اطلاعات ===== -->
            <div class="info-bar">
                <span><i class="bi bi-file-earmark-text"></i> <span id="totalQ">۰</span> سؤال</span>
                <span><i class="bi bi-check-circle"></i> <span id="answeredQ">۰</span> پاسخ داده شده</span>
                <span><i class="bi bi-bar-chart"></i> <span id="difficultyText">سطح: متوسط</span></span>
            </div>

            <!-- ===== پیشرفت ===== -->
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width:0%"></div>
            </div>

            <!-- ===== سوالات ===== -->
            <div id="questionsContainer"></div>

            <!-- ===== دکمه‌ها ===== -->
            <div class="actions" id="actionsArea">
                <button class="btn-prev" id="prevBtn" disabled>← قبلی</button>
                <span class="counter" id="questionCounter">۱ از ۰</span>
                <button class="btn-next" id="nextBtn">بعدی →</button>
                <button class="btn-submit" id="submitBtn">✅ پایان آزمون</button>
            </div>

            <!-- ===== نتیجه ===== -->
            <div class="result-box" id="resultBox">
                <div class="result-icon" id="resultIcon">🏆</div>
                <div class="result-title" id="resultTitle">تبریک!</div>
                <div class="result-score" id="resultScore">۰%</div>
                <div class="result-details">
                    <div>✅ صحیح: <span class="correct" id="resultCorrect">۰</span></div>
                    <div>❌ غلط: <span class="wrong" id="resultWrong">۰</span></div>
                </div>
                <div class="result-actions">
                    <button class="btn-retry" onclick="location.reload()">🔄 تلاش مجدد</button>
                    <a href="student-dashboard.html" class="btn-dashboard">🏠 بازگشت به داشبورد</a>
                    <a href="rewards-dashboard.html" class="btn-rewards">🏆 جوایز</a>
                </div>
            </div>

        </div>
    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/role-manager.js"></script>
    <script src="js/rewards-system.js"></script>
    <script src="js/theme-manager.js"></script>

    <script>
        // ============================================
        // داده‌های آزمون
        // ============================================
        const exam = {
            title: 'آزمون ریاضی فصل اول',
            difficulty: 'متوسط',
            timeLimit: 15,
            questions: [
                { text: '۵ × (۳ + ۲) چند است؟', options: ['۱۰', '۱۵', '۲۰', '۲۵'], correct: 3 },
                { text: 'مساحت مربع به ضلع ۴ چند است؟', options: ['۸', '۱۲', '۱۶', '۲۰'], correct: 2 },
                { text: 'کدام عدد بزرگ‌تر است؟', options: ['۰.۵', '۰.۰۵', '۰.۵۵', '۰.۵۰۵'], correct: 2 },
                { text: '۱۲ ÷ ۴ چند است؟', options: ['۲', '۳', '۴', '۶'], correct: 1 },
                { text: 'محیط مستطیل ۸ و ۵ چند است؟', options: ['۱۳', '۲۶', '۴۰', '۲۰'], correct: 1 }
            ]
        };

        // ============================================
        // متغیرها
        // ============================================
        let current = 0;
        let answers = {};
        let timerInterval;
        let timeLeft = exam.timeLimit * 60;
        let isSubmitted = false;

        // المان‌ها
        const container = document.getElementById('questionsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const counter = document.getElementById('questionCounter');
        const progressFill = document.getElementById('progressFill');
        const timerDisplay = document.getElementById('timerDisplay');
        const totalQ = document.getElementById('totalQ');
        const answeredQ = document.getElementById('answeredQ');

        // ============================================
        // 1. مقداردهی
        // ============================================
        function init() {
            document.getElementById('examTitle').textContent = exam.title;
            document.getElementById('difficultyText').textContent = 'سطح: ' + exam.difficulty;
            totalQ.textContent = exam.questions.length;
            renderQuestions();
            showQuestion(0);
            startTimer();
            updateStats();
            console.log('📝 صفحه آزمون مقداردهی شد!');
        }

        // ============================================
        // 2. رندر سوالات
        // ============================================
        function renderQuestions() {
            container.innerHTML = '';
            const letters = ['الف', 'ب', 'پ', 'ت'];

            exam.questions.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = 'question';
                div.dataset.index = index;

                let optionsHTML = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHTML += `
                        <label class="option" data-optindex="${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}">
                            <span class="label">${letters[optIndex]})</span>
                            <span class="text">${opt}</span>
                        </label>
                    `;
                });

                div.innerHTML = `
                    <div class="question-number">سؤال ${index + 1} از ${exam.questions.length}</div>
                    <div class="question-text">${q.text}</div>
                    <div class="options">${optionsHTML}</div>
                `;

                container.appendChild(div);

                // رویداد انتخاب گزینه
                const options = div.querySelectorAll('.option input[type="radio"]');
                options.forEach(input => {
                    input.addEventListener('change', function() {
                        const value = parseInt(this.value);
                        answers[index] = value;
                        div.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                        this.closest('.option').classList.add('selected');
                        updateStats();
                    });
                });
            });
        }

        // ============================================
        // 3. نمایش سوال
        // ============================================
        function showQuestion(index) {
            const cards = container.querySelectorAll('.question');
            cards.forEach((card, i) => {
                card.classList.toggle('active', i === index);
            });

            current = index;
            counter.textContent = `${index + 1} از ${exam.questions.length}`;

            prevBtn.disabled = index === 0;
            nextBtn.textContent = index === exam.questions.length - 1 ? 'پایان' : 'بعدی →';
        }

        // ============================================
        // 4. تایمر
        // ============================================
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 60) {
                    timerDisplay.classList.add('warning');
                }
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitExam(true);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // ============================================
        // 5. آمار
        // ============================================
        function updateStats() {
            const answered = Object.keys(answers).length;
            answeredQ.textContent = answered;
            const percent = Math.round((answered / exam.questions.length) * 100);
            progressFill.style.width = percent + '%';
        }

        // ============================================
        // 6. ثبت آزمون
        // ============================================
        async function submitExam(auto = false) {
            if (isSubmitted) return;

            const total = exam.questions.length;
            const answered = Object.keys(answers).length;

            if (!auto && answered < total) {
                const confirm = await darsbeamConfirm({
                    title: '⚠️ هنوز کامل نکردی!',
                    text: `از ${total} سؤال، فقط ${answered} تا رو پاسخ دادی.`,
                    icon: 'exclamation-triangle',
                    confirmText: 'بله، ثبت کن',
                    cancelText: 'بازگشت',
                    type: 'warning'
                });
                if (!confirm) return;
            }

            if (auto) {
                await darsbeamConfirm({
                    title: '⏰ زمان تمام شد!',
                    text: 'آزمون به صورت خودکار ثبت شد.',
                    icon: 'clock',
                    confirmText: 'باشه',
                    cancelText: '',
                    type: 'danger'
                });
            }

            // محاسبه نمره
            let correct = 0;
            exam.questions.forEach((q, index) => {
                if (answers[index] === q.correct) {
                    correct++;
                }
            });

            const score = Math.round((correct / total) * 100);
            const passed = score >= 60;

            // ذخیره نتیجه
            const result = {
                examTitle: exam.title,
                score: score,
                correct: correct,
                total: total,
                passed: passed,
                date: new Date().toISOString()
            };

            const results = JSON.parse(localStorage.getItem('darsbeam_exam_results') || '[]');
            results.push(result);
            localStorage.setItem('darsbeam_exam_results', JSON.stringify(results));

            // ===== ثبت در سیستم جایزه =====
            try {
                if (typeof darsbeamRewards !== 'undefined' && darsbeamRewards) {
                    const userRole = localStorage.getItem('user_role') || 'student';
                    const userId = userRole === 'teacher' ? 'teacher_1' : 'student_1';
                    
                    if (typeof initRewards === 'function') {
                        darsbeamRewards = initRewards(userId);
                    }
                    
                    darsbeamRewards.logExam({
                        examTitle: exam.title,
                        score: score,
                        totalQuestions: total,
                        correctAnswers: correct
                    });
                    console.log('✅ ثبت در سیستم جایزه انجام شد!');
                }
            } catch (e) {
                console.warn('⚠️ سیستم جایزه در دسترس نیست');
            }

            // نمایش نتیجه
            showResult(correct, total, score, passed);
            clearInterval(timerInterval);
            isSubmitted = true;
        }

        // ============================================
        // 7. نمایش نتیجه
        // ============================================
        function showResult(correct, total, score, passed) {
            document.getElementById('resultIcon').textContent = passed ? '🏆' : '💪';
            document.getElementById('resultTitle').textContent = passed ? '🎉 تبریک!' : '💪 تلاش خوبی بود!';
            document.getElementById('resultScore').textContent = score + '%';
            document.getElementById('resultCorrect').textContent = correct;
            document.getElementById('resultWrong').textContent = total - correct;

            document.getElementById('questionsContainer').style.display = 'none';
            document.getElementById('actionsArea').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';
            document.querySelector('.info-bar').style.display = 'none';
            document.querySelector('.exam-header .timer').style.display = 'none';
            document.getElementById('resultBox').classList.add('active');
        }

        // ============================================
        // 8. رویدادها
        // ============================================
        prevBtn.addEventListener('click', () => {
            if (current > 0) showQuestion(current - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (current < exam.questions.length - 1) {
                showQuestion(current + 1);
            } else {
                submitExam();
            }
        });

        submitBtn.addEventListener('click', () => submitExam());

        // ============================================
        // 9. اجرا
        // ============================================
        init();
        console.log('📝 صفحه آزمون با موفقیت بارگذاری شد!');
    </script>

</body>

</html>
