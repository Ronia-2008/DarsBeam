<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون ریاضی فصل اول | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/exam-detail.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== دکمه‌ی تنظیمات (سایدبار) ===== */
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        .exam-detail-page {
            background: var(--bg-body);
            min-height: 100vh;
        }
    </style>
</head>

<body>

    <!-- لودینگ ساده -->
<div id="pageLoader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-body); z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
">
    <div style="text-align: center;">
        <i class="bi bi-book-half" style="font-size: 48px; color: var(--primary-color); animation: spin 1s linear infinite;"></i>
        <p style="margin-top: 12px; color: var(--text-secondary);">در حال بارگذاری...</p>
    </div>
</div>

<style>
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('pageLoader').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('pageLoader').style.display = 'none';
            }, 500);
        }, 500);
    });
</script>

    <!-- ===== دکمه‌ی تنظیمات ===== -->
    <div class="settings-btn-wrapper">
        <button id="settingsToggleBtn">
            <i class="bi bi-gear-fill"></i>
        </button>
    </div>

    <!-- ===== پنل تنظیمات ===== -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h4><i class="bi bi-sliders"></i> تنظیمات</h4>
            <button id="closeSettings"><i class="bi bi-x-lg"></i></button>
        </div>
        <hr>
        <div class="setting-item">
            <label for="darkMode">🌙 حالت روشن / تیره</label>
            <input type="checkbox" id="darkMode">
        </div>
        <div class="setting-item">
            <label>🎨 رنگ اصلی سایت</label>
            <div class="theme-colors">
                <button class="theme-color blue" data-color="#2563EB"></button>
                <button class="theme-color purple" data-color="#7C3AED"></button>
                <button class="theme-color green" data-color="#10B981"></button>
                <button class="theme-color orange" data-color="#F97316"></button>
            </div>
        </div>
    </div>

    <!-- ===========================
            صفحه‌ی آزمون
    =========================== -->
    <main class="exam-detail-page">

        <div class="exam-container">

            <!-- ===== هدر آزمون ===== -->
            <header class="exam-header">
                <div class="exam-header-left">
                    <a href="student-dashboard.html" class="back-btn">
                        <i class="bi bi-arrow-right"></i>
                        بازگشت
                    </a>
                    <div class="exam-title-group">
                        <h1 id="examTitle">آزمون ریاضی فصل اول</h1>
                        <span class="exam-badge" id="examSubject">📚 ریاضی</span>
                    </div>
                </div>
                <div class="exam-header-right">
                    <div class="exam-timer" id="examTimer">
                        <i class="bi bi-clock"></i>
                        <span id="timerDisplay">15:00</span>
                    </div>
                </div>
            </header>

            <!-- ===== اطلاعات آزمون ===== -->
            <div class="exam-info-bar">
                <div class="info-item">
                    <i class="bi bi-question-circle"></i>
                    <span id="totalQuestions">10 سؤال</span>
                </div>
                <div class="info-item">
                    <i class="bi bi-check-circle"></i>
                    <span id="answeredQuestions">0 پاسخ داده شده</span>
                </div>
                <div class="info-item">
                    <i class="bi bi-bar-chart"></i>
                    <span id="examDifficulty">سطح: متوسط</span>
                </div>
            </div>

            <!-- ===== پیشرفت ===== -->
            <div class="exam-progress-bar">
                <div class="progress-track">
                    <div class="progress-fill" id="examProgressFill" style="width: 0%;"></div>
                </div>
                <span class="progress-text" id="examProgressText">۰%</span>
            </div>

            <!-- ===== سوالات ===== -->
            <div class="questions-container" id="questionsContainer">
                <!-- توسط JS پر میشه -->
            </div>

            <!-- ===== دکمه‌های پایین ===== -->
            <div class="exam-actions">
                <button class="btn-prev" id="prevQuestion" disabled>
                    <i class="bi bi-arrow-right"></i>
                    قبلی
                </button>
                <span class="question-counter" id="questionCounter">۱ از ۱۰</span>
                <button class="btn-next" id="nextQuestion">
                    بعدی
                    <i class="bi bi-arrow-left"></i>
                </button>
                <button class="btn-submit" id="submitExam">
                    <i class="bi bi-check-lg"></i>
                    پایان آزمون
                </button>
            </div>

        </div>

    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/exam-detail.js"></script>

</body>

</html>
