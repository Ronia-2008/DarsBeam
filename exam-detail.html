<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون ریاضی فصل اول | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/exam-detail.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notifications.css">

    <style>
        /* ===== دکمه‌ی تنظیمات (سایدبار) ===== */
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        .exam-detail-page {
            background: var(--bg-body);
            min-height: 100vh;
        }
    </style>
</head>

<body>

    <!-- لودینگ ساده -->
<div id="pageLoader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-body); z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
">
    <div style="text-align: center;">
        <i class="bi bi-book-half" style="font-size: 48px; color: var(--primary-color); animation: spin 1s linear infinite;"></i>
        <p style="margin-top: 12px; color: var(--text-secondary);">در حال بارگذاری...</p>
    </div>
</div>

<style>
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('pageLoader').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('pageLoader').style.display = 'none';
            }, 500);
        }, 500);
    });
</script>

    <!-- ===== دکمه چرخ‌دنده (تنظیمات) ===== -->
<div class="settings-fab">
    <button onclick="window.location.href='settings-page.html'">
        <i class="bi bi-gear-fill"></i>
    </button>
</div>

<!-- استایل دکمه -->
<style>
    .settings-fab {
        position: fixed;
        bottom: 30px;
        left: 30px;
        z-index: 1000;
    }

    .settings-fab button {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--primary-color);
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .settings-fab button:hover {
        transform: rotate(60deg) scale(1.05);
        box-shadow: 0 6px 24px rgba(37, 99, 235, 0.4);
    }

    body.dark-theme .settings-fab button {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 576px) {
        .settings-fab {
            bottom: 16px;
            left: 16px;
        }
        .settings-fab button {
            width: 48px;
            height: 48px;
            font-size: 20px;
        }
    }
</style>

    <!-- ===========================
            صفحه‌ی آزمون
    =========================== -->
    <main class="exam-detail-page">

        <div class="exam-container">

            <!-- ===== هدر آزمون ===== -->
            <header class="exam-header">
                <div class="exam-header-left">
                    <a href="student-dashboard.html" class="back-btn">
                        <i class="bi bi-arrow-right"></i>
                        بازگشت
                    </a>
                    <div class="exam-title-group">
                        <h1 id="examTitle">آزمون ریاضی فصل اول</h1>
                        <span class="exam-badge" id="examSubject">📚 ریاضی</span>
                    </div>
                </div>
                <div class="exam-header-right">
                    <div class="exam-timer" id="examTimer">
                        <i class="bi bi-clock"></i>
                        <span id="timerDisplay">15:00</span>
                    </div>
                </div>
            </header>

            <!-- ===== اطلاعات آزمون ===== -->
            <div class="exam-info-bar">
                <div class="info-item">
                    <i class="bi bi-question-circle"></i>
                    <span id="totalQuestions">10 سؤال</span>
                </div>
                <div class="info-item">
                    <i class="bi bi-check-circle"></i>
                    <span id="answeredQuestions">0 پاسخ داده شده</span>
                </div>
                <div class="info-item">
                    <i class="bi bi-bar-chart"></i>
                    <span id="examDifficulty">سطح: متوسط</span>
                </div>
            </div>

            <!-- ===== پیشرفت ===== -->
            <div class="exam-progress-bar">
                <div class="progress-track">
                    <div class="progress-fill" id="examProgressFill" style="width: 0%;"></div>
                </div>
                <span class="progress-text" id="examProgressText">۰%</span>
            </div>

            <!-- ===== سوالات ===== -->
            <div class="questions-container" id="questionsContainer">
                <!-- توسط JS پر میشه -->
            </div>

            <!-- ===== دکمه‌های پایین ===== -->
            <div class="exam-actions">
                <button class="btn-prev" id="prevQuestion" disabled>
                    <i class="bi bi-arrow-right"></i>
                    قبلی
                </button>
                <span class="question-counter" id="questionCounter">۱ از ۱۰</span>
                <button class="btn-next" id="nextQuestion">
                    بعدی
                    <i class="bi bi-arrow-left"></i>
                </button>
                <button class="btn-submit" id="submitExam">
                    <i class="bi bi-check-lg"></i>
                    پایان آزمون
                </button>
            </div>

        </div>

    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--<script src="js/settings.js"></script>-->
    <script src="js/modal.js"></script>
    <script src="js/exam-detail.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/theme-manager.js"></script>

    <script>
    // ============================================
    // 1. پنل تنظیمات
    // ============================================
    function toggleSettingsPanel(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        const panel = document.getElementById('settingsPanel');
        if (panel) {
            panel.classList.toggle('open');
            console.log('🔘 پنل تنظیمات باز/بسته شد');
        }
    }

    function closeSettingsPanel() {
        const panel = document.getElementById('settingsPanel');
        if (panel) {
            panel.classList.remove('open');
            console.log('🔘 پنل تنظیمات بسته شد');
        }
    }

    // ============================================
    // 2. تم دارک/لایت
    // ============================================
    function toggleDarkMode(isDark) {
        if (isDark) {
            document.body.classList.add('dark-theme');
            localStorage.setItem('darsbeam-theme', 'dark');
            console.log('🌙 دارک مود فعال شد');
        } else {
            document.body.classList.remove('dark-theme');
            localStorage.setItem('darsbeam-theme', 'light');
            console.log('☀️ لایت مود فعال شد');
        }
    }

    function loadTheme() {
        const savedTheme = localStorage.getItem('darsbeam-theme');
        const darkModeCheckbox = document.getElementById('darkMode');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            if (darkModeCheckbox) darkModeCheckbox.checked = true;
        } else {
            document.body.classList.remove('dark-theme');
            if (darkModeCheckbox) darkModeCheckbox.checked = false;
        }
        console.log('📂 تم بارگذاری شد:', savedTheme || 'light');
    }

    // ============================================
    // 3. تغییر رنگ اصلی
    // ============================================
    function changeThemeColor(color) {
        document.documentElement.style.setProperty('--primary-color', color);
        localStorage.setItem('darsbeam-color', color);
        
        // به‌روزرسانی دکمه‌های فعال
        document.querySelectorAll('.theme-color').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.color === color) {
                btn.classList.add('active');
            }
        });
        console.log('🎨 رنگ تغییر کرد به:', color);
    }

    function loadColor() {
        const savedColor = localStorage.getItem('darsbeam-color');
        if (savedColor) {
            changeThemeColor(savedColor);
        } else {
            const defaultBlue = document.querySelector('.theme-color.blue');
            if (defaultBlue) defaultBlue.classList.add('active');
        }
        console.log('🎨 رنگ بارگذاری شد:', savedColor || 'blue');
    }

    // ============================================
    // 4. چشمک (نمایش رمز) - فقط برای صفحات لاگین
    // ============================================
    function togglePasswordVisibility() {
        const input = document.getElementById('studentPassword');
        const icon = document.querySelector('.password-toggle i');
        if (!input) return;
        
        if (input.type === 'password') {
            input.type = 'text';
            if (icon) icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            if (icon) icon.className = 'bi bi-eye';
        }
    }

    // ============================================
    // 5. بارگذاری اولیه
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        loadTheme();
        loadColor();

        // بستن پنل با کلیک خارج از آن
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('settingsPanel');
            const btn = document.querySelector('.settings-btn-wrapper button');
            if (panel && panel.classList.contains('open')) {
                const isClickInside = panel.contains(e.target);
                const isClickOnBtn = btn && btn.contains(e.target);
                if (!isClickInside && !isClickOnBtn) {
                    panel.classList.remove('open');
                }
            }
        });

        // بستن پنل با کلید ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSettingsPanel();
            }
        });

        console.log('⚙️ تنظیمات با موفقیت بارگذاری شد!');
    });
</script>
</body>

</html>
