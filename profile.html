<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ===== دکمه‌ی تنظیمات ===== */
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        /* ===== صفحه‌ی پروفایل ===== */
        .profile-page {
            background: var(--bg-body);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .profile-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            transition: var(--transition);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 40px;
            color: white;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.2);
        }

        .profile-name {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .profile-role {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .profile-divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 20px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
        }

        /* ============================================
           دکمه‌ها
        ============================================ */

        /* ===== دکمه‌ی بازگشت ===== */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: #2563eb;
            color: #ffffff !important;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-back:hover {
            background: #1d4ed8;
            color: #ffffff !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
            text-decoration: none;
        }

        /* ===== دکمه‌ی ویرایش پروفایل ===== */
        .btn-edit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: transparent;
            color: #2563eb;
            border: 2px solid #2563eb;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-edit:hover {
            background: #2563eb;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.2);
        }

        /* ============================================
           دارک مود
        ============================================ */
        body.dark-theme .profile-card {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark-theme .info-row {
            border-color: #334155;
        }

        body.dark-theme .btn-back {
            background: #2563eb;
            color: #ffffff !important;
        }

        body.dark-theme .btn-back:hover {
            background: #1d4ed8;
            color: #ffffff !important;
        }

        body.dark-theme .btn-edit {
            color: #60a5fa;
            border-color: #60a5fa;
        }

        body.dark-theme .btn-edit:hover {
            background: #60a5fa;
            color: #0f172a;
        }

        /* ============================================
           ریسپانسیو
        ============================================ */
        @media (max-width: 480px) {
            .profile-card {
                padding: 24px 16px;
            }
            
            .profile-avatar {
                width: 72px;
                height: 72px;
                font-size: 28px;
            }
            
            .profile-name {
                font-size: 20px;
            }
            
            .info-row {
                flex-direction: column;
                gap: 4px;
            }

            .btn-back,
            .btn-edit {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- لودینگ ساده -->
<div id="pageLoader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-body); z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
">
    <div style="text-align: center;">
        <i class="bi bi-book-half" style="font-size: 48px; color: var(--primary-color); animation: spin 1s linear infinite;"></i>
        <p style="margin-top: 12px; color: var(--text-secondary);">در حال بارگذاری...</p>
    </div>
</div>

<style>
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('pageLoader').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('pageLoader').style.display = 'none';
            }, 500);
        }, 500);
    });
</script>

    <!-- ===== دکمه‌ی تنظیمات ===== -->
    <div class="settings-btn-wrapper">
        <button id="settingsToggleBtn">
            <i class="bi bi-gear-fill"></i>
        </button>
    </div>

    <!-- ===== پنل تنظیمات ===== -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h4><i class="bi bi-sliders"></i> تنظیمات</h4>
            <button id="closeSettings"><i class="bi bi-x-lg"></i></button>
        </div>
        <hr>
        <div class="setting-item">
            <label for="darkMode">🌙 حالت روشن / تیره</label>
            <input type="checkbox" id="darkMode">
        </div>
        <div class="setting-item">
            <label>🎨 رنگ اصلی سایت</label>
            <div class="theme-colors">
                <button class="theme-color blue" data-color="#2563EB"></button>
                <button class="theme-color purple" data-color="#7C3AED"></button>
                <button class="theme-color green" data-color="#10B981"></button>
                <button class="theme-color orange" data-color="#F97316"></button>
            </div>
        </div>
    </div>

    <!-- ===========================
            پروفایل
    =========================== -->
    <main class="profile-page">
        <div class="profile-container">

            <div class="profile-card">
                <div class="profile-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h2 class="profile-name">خورشید سوری</h2>
                <p class="profile-role">🎓 دانش‌آموز پایه دوازدهم</p>

                <hr class="profile-divider">

                <div class="info-row">
                    <span class="info-label">📧 ایمیل</span>
                    <span class="info-value">Khorshid@email.com</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📱 شماره موبایل</span>
                    <span class="info-value">09022501421</span>
                </div>
                <div class="info-row">
                    <span class="info-label">🏫 مدرسه</span>
                    <span class="info-value">دبیرستان کبری زرگران</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📚 پایه تحصیلی</span>
                    <span class="info-value">دوازدهم</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📅 تاریخ عضویت</span>
                    <span class="info-value">۱۴۰۴/۰۲/۱۵</span>
                </div>

                <hr class="profile-divider">

                <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                    <a href="student-dashboard.html" class="btn-back">
                        <i class="bi bi-arrow-right"></i>
                        بازگشت به داشبورد
                    </a>
                    <button onclick="editProfile()" class="btn-edit">
                        <i class="bi bi-pencil-square"></i>
                        ویرایش پروفایل
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/modal.js"></script>

    <script>
        function editProfile() {
            darsbeamConfirm({
                title: '✏️ ویرایش پروفایل',
                text: 'این بخش در حال توسعه است!\nبه زودی می‌تونی اطلاعاتت رو ویرایش کنی.',
                icon: 'pencil-square',
                confirmText: 'باشه',
                cancelText: '',
                type: 'info'
            });
        }
    </script>

</body>

</html>
