<head>

    <!-- Bootstrap -->

    <!-- Bootstrap Icons -->

    <style>
        /* ===== دکمه‌ی تنظیمات ===== */
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        /* ===== صفحه‌ی پروفایل ===== */
        .profile-page {
            background: var(--bg-body);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .profile-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            transition: var(--transition);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 40px;
            color: white;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.2);
        }

        .profile-name {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .profile-role {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .profile-divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 20px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
        }

        /* ============================================
           دکمه‌ها
        ============================================ */

        /* ===== دکمه‌ی بازگشت ===== */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: #2563eb;
            color: #ffffff !important;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-back:hover {
            background: #1d4ed8;
            color: #ffffff !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
            text-decoration: none;
        }

        /* ===== دکمه‌ی ویرایش پروفایل ===== */
        .btn-edit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: transparent;
            color: #2563eb;
            border: 2px solid #2563eb;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-edit:hover {
            background: #2563eb;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.2);
        }

        /* ============================================
           دارک مود
        ============================================ */
        body.dark-theme .profile-card {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark-theme .info-row {
            border-color: #334155;
        }

        body.dark-theme .btn-back {
            background: #2563eb;
            color: #ffffff !important;
        }

        body.dark-theme .btn-back:hover {
            background: #1d4ed8;
            color: #ffffff !important;
        }

        body.dark-theme .btn-edit {
            color: #60a5fa;
            border-color: #60a5fa;
        }

        body.dark-theme .btn-edit:hover {
            background: #60a5fa;
            color: #0f172a;
        }

        /* ============================================
           ریسپانسیو
        ============================================ */
        @media (max-width: 480px) {
            .profile-card {
                padding: 24px 16px;
            }
            
            .profile-avatar {
                width: 72px;
                height: 72px;
                font-size: 28px;
            }
            
            .profile-name {
                font-size: 20px;
            }
            
            .info-row {
                flex-direction: column;
                gap: 4px;
            }

            .btn-back,
            .btn-edit {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<script>
    // ============================================
    // 1. پنل تنظیمات
    // ============================================
    function toggleSettingsPanel(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        const panel = document.getElementById('settingsPanel');
        if (panel) {
            panel.classList.toggle('open');
            console.log('🔘 پنل تنظیمات باز/بسته شد');
        }
    }

    function closeSettingsPanel() {
        const panel = document.getElementById('settingsPanel');
        if (panel) {
            panel.classList.remove('open');
            console.log('🔘 پنل تنظیمات بسته شد');
        }
    }

    // ============================================
    // 2. تم دارک/لایت
    // ============================================
    function toggleDarkMode(isDark) {
        if (isDark) {
            document.body.classList.add('dark-theme');
            localStorage.setItem('darsbeam-theme', 'dark');
            console.log('🌙 دارک مود فعال شد');
        } else {
            document.body.classList.remove('dark-theme');
            localStorage.setItem('darsbeam-theme', 'light');
            console.log('☀️ لایت مود فعال شد');
        }
    }

    function loadTheme() {
        const savedTheme = localStorage.getItem('darsbeam-theme');
        const darkModeCheckbox = document.getElementById('darkMode');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            if (darkModeCheckbox) darkModeCheckbox.checked = true;
        } else {
            document.body.classList.remove('dark-theme');
            if (darkModeCheckbox) darkModeCheckbox.checked = false;
        }
        console.log('📂 تم بارگذاری شد:', savedTheme || 'light');
    }

    // ============================================
    // 3. تغییر رنگ اصلی
    // ============================================
    function changeThemeColor(color) {
        document.documentElement.style.setProperty('--primary-color', color);
        localStorage.setItem('darsbeam-color', color);
        
        // به‌روزرسانی دکمه‌های فعال
        document.querySelectorAll('.theme-color').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.color === color) {
                btn.classList.add('active');
            }
        });
        console.log('🎨 رنگ تغییر کرد به:', color);
    }

    function loadColor() {
        const savedColor = localStorage.getItem('darsbeam-color');
        if (savedColor) {
            changeThemeColor(savedColor);
        } else {
            const defaultBlue = document.querySelector('.theme-color.blue');
            if (defaultBlue) defaultBlue.classList.add('active');
        }
        console.log('🎨 رنگ بارگذاری شد:', savedColor || 'blue');
    }

    // ============================================
    // 4. چشمک (نمایش رمز) - فقط برای صفحات لاگین
    // ============================================
    function togglePasswordVisibility() {
        const input = document.getElementById('studentPassword');
        const icon = document.querySelector('.password-toggle i');
        if (!input) return;
        
        if (input.type === 'password') {
            input.type = 'text';
            if (icon) icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            if (icon) icon.className = 'bi bi-eye';
        }
    }

    // ============================================
    // 5. بارگذاری اولیه
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        loadTheme();
        loadColor();

        // بستن پنل با کلیک خارج از آن
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('settingsPanel');
            const btn = document.querySelector('.settings-btn-wrapper button');
            if (panel && panel.classList.contains('open')) {
                const isClickInside = panel.contains(e.target);
                const isClickOnBtn = btn && btn.contains(e.target);
                if (!isClickInside && !isClickOnBtn) {
                    panel.classList.remove('open');
                }
            }
        });

        // بستن پنل با کلید ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSettingsPanel();
            }
        });

        console.log('⚙️ تنظیمات با موفقیت بارگذاری شد!');
    });
</script>
