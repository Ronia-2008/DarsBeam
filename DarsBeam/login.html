<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ورود | درس‌بیم</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Login CSS -->

    <link
        rel="stylesheet"
        href="css/login.css">

</head>


<body>


<!-- ===========================
        Login Page
=========================== -->

<main class="login-page">


    <div class="login-container">


        <!-- Logo -->

        <a href="index.html" class="login-logo">

            <i class="bi bi-book-half"></i>

            DarsBeam

        </a>


        <!-- Title -->

        <div class="login-title">

            <h1>
                به درس‌بیم خوش آمدید 👋
            </h1>

            <p>
                برای ادامه، نقش خود را انتخاب کنید
            </p>

        </div>


        <!-- Role Cards -->

        <div class="role-cards">


            <!-- Student -->

            <a
    href="student-login.html"
    class="role-card student-card">


                <div class="role-icon">

                    <i class="bi bi-mortarboard"></i>

                </div>


                <h2>
                    دانش‌آموز
                </h2>


                <p>
                    درس بخوان، تمرین کن و
                    پیشرفتت را دنبال کن.
                </p>


                <span class="role-btn">

                    ورود به بخش دانش‌آموز

                    <i class="bi bi-arrow-left"></i>

                </span>


            </a>



            <!-- Teacher -->

            <a
                href="teacher-login.html"
                class="role-card teacher-card">


                <div class="role-icon">

                    <i class="bi bi-person-video3"></i>

                </div>


                <h2>
                    معلم
                </h2>


                <p>
                    آزمون بساز، سوال‌ها را مدیریت کن
                    و عملکرد دانش‌آموزان را ببین.
                </p>


                <span class="role-btn">

                    ورود به بخش معلم

                    <i class="bi bi-arrow-left"></i>

                </span>


            </a>


        </div>


        <!-- Back -->

        <a
            href="index.html"
            class="back-home">

            <i class="bi bi-arrow-right"></i>

            بازگشت به صفحه اصلی

        </a>


    </div>


</main>


</body>

</html>
