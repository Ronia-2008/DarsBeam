<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/notifications.css">

    <style>
        /* ===== دکمه‌ی تنظیمات ===== */
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        /* ===== هماهنگی تم با login.css ===== */
        .login-page {
            background: var(--bg-body) !important;
        }

        .login-container {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
        }

        .login-logo {
            color: var(--text-primary) !important;
        }

        .login-title h1 {
            color: var(--text-primary) !important;
        }

        .login-title p {
            color: var(--text-secondary) !important;
        }

        .role-card {
            background: var(--bg-body) !important;
            border: 2px solid var(--border-color) !important;
        }

        .role-card:hover {
            border-color: var(--primary-color) !important;
            background: var(--bg-card-hover) !important;
        }

        .role-card h2 {
            color: var(--text-primary) !important;
        }

        .role-card p {
            color: var(--text-secondary) !important;
        }

        .role-btn {
            color: var(--primary-color) !important;
        }

        .role-btn:hover {
            color: var(--primary-hover) !important;
        }

        .back-home {
            color: var(--text-secondary) !important;
        }

        .back-home:hover {
            color: var(--primary-color) !important;
        }

        body.dark-theme .login-container {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        body.dark-theme .role-card {
            background: #0f172a !important;
            border-color: #334155 !important;
        }

        body.dark-theme .role-card:hover {
            background: #1e293b !important;
            border-color: var(--primary-color) !important;
        }
    </style>
</head>

<body>

    <!-- لودینگ ساده -->
<div id="pageLoader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-body); z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
">
    <div style="text-align: center;">
        <i class="bi bi-book-half" style="font-size: 48px; color: var(--primary-color); animation: spin 1s linear infinite;"></i>
        <p style="margin-top: 12px; color: var(--text-secondary);">در حال بارگذاری...</p>
    </div>
</div>

<style>
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('pageLoader').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('pageLoader').style.display = 'none';
            }, 500);
        }, 500);
    });
</script>

    <!-- ===== دکمه چرخ‌دنده (تنظیمات) ===== -->
<div class="settings-fab">
    <button onclick="window.location.href='settings-page.html'">
        <i class="bi bi-gear-fill"></i>
    </button>
</div>

<!-- استایل دکمه -->
<style>
    .settings-fab {
        position: fixed;
        bottom: 30px;
        left: 30px;
        z-index: 1000;
    }

    .settings-fab button {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--primary-color);
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .settings-fab button:hover {
        transform: rotate(60deg) scale(1.05);
        box-shadow: 0 6px 24px rgba(37, 99, 235, 0.4);
    }

    body.dark-theme .settings-fab button {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 576px) {
        .settings-fab {
            bottom: 16px;
            left: 16px;
        }
        .settings-fab button {
            width: 48px;
            height: 48px;
            font-size: 20px;
        }
    }
</style>
    <!-- ===========================
            Login Page
    =========================== -->
    <main class="login-page">
        <div class="login-container">

            <!-- Logo -->
            <a href="index.html" class="login-logo">
                <i class="bi bi-book-half"></i>
                DarsBeam
            </a>

            <!-- Title -->
            <div class="login-title">
                <h1>به درس‌بیم خوش آمدید 👋</h1>
                <p>برای ادامه، نقش خود را انتخاب کنید</p>
            </div>

            <!-- Role Cards -->
            <div class="role-cards">

                <!-- Student -->
                <a href="student-login.html" class="role-card student-card">
                    <div class="role-icon">
                        <i class="bi bi-mortarboard"></i>
                    </div>
                    <h2>دانش‌آموز</h2>
                    <p>درس بخوان، تمرین کن و پیشرفتت را دنبال کن.</p>
                    <span class="role-btn">
                        ورود به بخش دانش‌آموز
                        <i class="bi bi-arrow-left"></i>
                    </span>
                </a>

                <!-- Teacher -->
                <a href="teacher-login.html" class="role-card teacher-card">
                    <div class="role-icon">
                        <i class="bi bi-person-video3"></i>
                    </div>
                    <h2>معلم</h2>
                    <p>آزمون بساز، سوال‌ها را مدیریت کن و عملکرد دانش‌آموزان را ببین.</p>
                    <span class="role-btn">
                        ورود به بخش معلم
                        <i class="bi bi-arrow-left"></i>
                    </span>
                </a>

            </div>

            <!-- Back -->
            <a href="index.html" class="back-home">
                <i class="bi bi-arrow-right"></i>
                بازگشت به صفحه اصلی
            </a>

        </div>
    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/theme-manager.js"></script>
    <script>
    // ============================================
        // 1. تم دارک/لایت
        // ============================================
        function toggleDarkMode(isDark) {
            if (isDark) {
                document.body.classList.add('dark-theme');
                localStorage.setItem('darsbeam-theme', 'dark');
            } else {
                document.body.classList.remove('dark-theme');
                localStorage.setItem('darsbeam-theme', 'light');
            }
            // ===== ارسال رویداد به صفحات دیگه =====
            window.dispatchEvent(new Event('storage'));
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('darsbeam-theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
        }

        // ============================================
        // 2. تغییر رنگ اصلی
        // ============================================
        function changeThemeColor(color) {
            document.documentElement.style.setProperty('--primary-color', color);
            localStorage.setItem('darsbeam-color', color);
            // ===== ارسال رویداد به صفحات دیگه =====
            window.dispatchEvent(new Event('storage'));
        }

        function loadColor() {
            const savedColor = localStorage.getItem('darsbeam-color');
            if (savedColor) {
                document.documentElement.style.setProperty('--primary-color', savedColor);
            }
        }

        // ============================================
        // 3. به‌روزرسانی خودکار هنگام تغییر در صفحه دیگه
        // ============================================
        function applySettings() {
            loadTheme();
            loadColor();
            console.log('🔄 تنظیمات به‌روزرسانی شد!');
        }

        // گوش دادن به رویداد storage (وقتی صفحه دیگه تغییری میده)
        window.addEventListener('storage', function(e) {
            if (e.key === 'darsbeam-theme' || e.key === 'darsbeam-color') {
                applySettings();
                console.log('📥 تغییرات از صفحه دیگه دریافت شد!');
            }
        });
        // ============================================
        // 6. بارگذاری اولیه
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            applySettings();
            console.log('🎨 تنظیمات اولیه بارگذاری شدند!');
        });
</script>

</body>

</html>
