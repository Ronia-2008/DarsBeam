<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/login.css">

    <style>
        /* ===== دکمه‌ی تنظیمات ===== */
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        /* ===== هماهنگی تم با login.css ===== */
        .login-page {
            background: var(--bg-body) !important;
        }

        .login-container {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
        }

        .login-logo {
            color: var(--text-primary) !important;
        }

        .login-title h1 {
            color: var(--text-primary) !important;
        }

        .login-title p {
            color: var(--text-secondary) !important;
        }

        .role-card {
            background: var(--bg-body) !important;
            border: 2px solid var(--border-color) !important;
        }

        .role-card:hover {
            border-color: var(--primary-color) !important;
            background: var(--bg-card-hover) !important;
        }

        .role-card h2 {
            color: var(--text-primary) !important;
        }

        .role-card p {
            color: var(--text-secondary) !important;
        }

        .role-btn {
            color: var(--primary-color) !important;
        }

        .role-btn:hover {
            color: var(--primary-hover) !important;
        }

        .back-home {
            color: var(--text-secondary) !important;
        }

        .back-home:hover {
            color: var(--primary-color) !important;
        }

        body.dark-theme .login-container {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        body.dark-theme .role-card {
            background: #0f172a !important;
            border-color: #334155 !important;
        }

        body.dark-theme .role-card:hover {
            background: #1e293b !important;
            border-color: var(--primary-color) !important;
        }
    </style>
</head>

<body>

    <!-- لودینگ ساده -->
<div id="pageLoader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-body); z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
">
    <div style="text-align: center;">
        <i class="bi bi-book-half" style="font-size: 48px; color: var(--primary-color); animation: spin 1s linear infinite;"></i>
        <p style="margin-top: 12px; color: var(--text-secondary);">در حال بارگذاری...</p>
    </div>
</div>

<style>
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('pageLoader').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('pageLoader').style.display = 'none';
            }, 500);
        }, 500);
    });
</script>

    <!-- ===== دکمه‌ی تنظیمات ===== -->
    <div class="settings-btn-wrapper">
        <button id="settingsToggleBtn">
            <i class="bi bi-gear-fill"></i>
        </button>
    </div>

    <!-- ===== پنل تنظیمات ===== -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h4><i class="bi bi-sliders"></i> تنظیمات</h4>
            <button id="closeSettings"><i class="bi bi-x-lg"></i></button>
        </div>
        <hr>
        <div class="setting-item">
            <label for="darkMode">🌙 حالت روشن / تیره</label>
            <input type="checkbox" id="darkMode">
        </div>
        <div class="setting-item">
            <label>🎨 رنگ اصلی سایت</label>
            <div class="theme-colors">
                <button class="theme-color blue" data-color="#2563EB"></button>
                <button class="theme-color purple" data-color="#7C3AED"></button>
                <button class="theme-color green" data-color="#10B981"></button>
                <button class="theme-color orange" data-color="#F97316"></button>
            </div>
        </div>
    </div>

    <!-- ===========================
            Login Page
    =========================== -->
    <main class="login-page">
        <div class="login-container">

            <!-- Logo -->
            <a href="index.html" class="login-logo">
                <i class="bi bi-book-half"></i>
                DarsBeam
            </a>

            <!-- Title -->
            <div class="login-title">
                <h1>به درس‌بیم خوش آمدید 👋</h1>
                <p>برای ادامه، نقش خود را انتخاب کنید</p>
            </div>

            <!-- Role Cards -->
            <div class="role-cards">

                <!-- Student -->
                <a href="student-login.html" class="role-card student-card">
                    <div class="role-icon">
                        <i class="bi bi-mortarboard"></i>
                    </div>
                    <h2>دانش‌آموز</h2>
                    <p>درس بخوان، تمرین کن و پیشرفتت را دنبال کن.</p>
                    <span class="role-btn">
                        ورود به بخش دانش‌آموز
                        <i class="bi bi-arrow-left"></i>
                    </span>
                </a>

                <!-- Teacher -->
                <a href="teacher-login.html" class="role-card teacher-card">
                    <div class="role-icon">
                        <i class="bi bi-person-video3"></i>
                    </div>
                    <h2>معلم</h2>
                    <p>آزمون بساز، سوال‌ها را مدیریت کن و عملکرد دانش‌آموزان را ببین.</p>
                    <span class="role-btn">
                        ورود به بخش معلم
                        <i class="bi bi-arrow-left"></i>
                    </span>
                </a>

            </div>

            <!-- Back -->
            <a href="index.html" class="back-home">
                <i class="bi bi-arrow-right"></i>
                بازگشت به صفحه اصلی
            </a>

        </div>
    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/settings.js"></script>

</body>

</html>
