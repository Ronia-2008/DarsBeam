<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود دانش‌آموز | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/student-login.css">

    <style>
        /* ===== دکمه‌ی تنظیمات ===== */
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        /* ===== هماهنگی تم با student-login.css ===== */
        .student-login-page {
            background: var(--bg-body) !important;
        }

        .student-login-box {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: var(--shadow-lg) !important;
        }

        .student-logo {
            color: var(--text-primary) !important;
        }

        .student-login-box h1 {
            color: var(--text-primary) !important;
        }

        .login-description {
            color: var(--text-secondary) !important;
        }

        .form-group label {
            color: var(--text-primary) !important;
        }

        .input-box {
            background: var(--bg-input) !important;
            border: 2px solid var(--border-color) !important;
        }

        .input-box input {
            color: var(--text-primary) !important;
        }

        .input-box i {
            color: var(--text-muted) !important;
        }

        .password-toggle {
            color: var(--text-muted) !important;
        }

        .password-toggle:hover {
            color: var(--text-primary) !important;
        }

        .login-options label {
            color: var(--text-secondary) !important;
        }

        .login-options a {
            color: var(--primary-color) !important;
        }

        .login-options a:hover {
            color: var(--primary-hover) !important;
        }

        .student-login-btn {
            background: var(--primary-color) !important;
            color: white !important;
        }

        .student-login-btn:hover {
            background: var(--primary-hover) !important;
        }

        .register-text {
            color: var(--text-secondary) !important;
        }

        .register-text a {
            color: var(--primary-color) !important;
        }

        .register-text a:hover {
            color: var(--primary-hover) !important;
        }

        .back-login {
            color: var(--text-secondary) !important;
        }

        .back-login:hover {
            color: var(--primary-color) !important;
        }

        /* ===== دارک مود ===== */
        body.dark-theme .student-login-box {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        body.dark-theme .input-box {
            background: #0f172a !important;
            border-color: #334155 !important;
        }

        body.dark-theme .input-box input {
            color: #f1f5f9 !important;
        }
    </style>
</head>

<body>

    <!-- ===== دکمه‌ی تنظیمات ===== -->
    <div class="settings-btn-wrapper">
        <button id="settingsToggleBtn">
            <i class="bi bi-gear-fill"></i>
        </button>
    </div>

    <!-- ===== پنل تنظیمات ===== -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h4><i class="bi bi-sliders"></i> تنظیمات</h4>
            <button id="closeSettings"><i class="bi bi-x-lg"></i></button>
        </div>
        <hr>
        <div class="setting-item">
            <label for="darkMode">🌙 حالت روشن / تیره</label>
            <input type="checkbox" id="darkMode">
        </div>
        <div class="setting-item">
            <label>🎨 رنگ اصلی سایت</label>
            <div class="theme-colors">
                <button class="theme-color blue" data-color="#2563EB"></button>
                <button class="theme-color purple" data-color="#7C3AED"></button>
                <button class="theme-color green" data-color="#10B981"></button>
                <button class="theme-color orange" data-color="#F97316"></button>
            </div>
        </div>
    </div>

    <!-- ===========================
            Student Login
    =========================== -->
    <main class="student-login-page">
        <div class="student-login-box">

            <!-- Logo -->
            <a href="index.html" class="student-logo">
                <i class="bi bi-book-half"></i>
                DarsBeam
            </a>

            <!-- Icon -->
            <div class="student-login-icon">
                <i class="bi bi-mortarboard"></i>
            </div>

            <!-- Title -->
            <h1>ورود دانش‌آموز</h1>
            <p class="login-description">به مسیر یادگیریت برگرد! 🚀</p>

            <!-- Form -->
            <form>

                <!-- Email / Phone -->
                <div class="form-group">
                    <label for="studentEmail">شماره موبایل یا ایمیل</label>
                    <div class="input-box">
                        <i class="bi bi-person"></i>
                        <input type="text" id="studentEmail" placeholder="شماره موبایل یا ایمیل">
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="studentPassword">رمز عبور</label>
                    <div class="input-box">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="studentPassword" placeholder="رمز عبور">
                        <button type="button" class="password-toggle">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember -->
                <div class="login-options">
                    <label>
                        <input type="checkbox">
                        مرا به خاطر بسپار
                    </label>
                    <a href="#">فراموشی رمز عبور؟</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="student-login-btn">
                    ورود به حساب
                    <i class="bi bi-arrow-left"></i>
                </button>

            </form>

            <!-- Register -->
            <div class="register-text">
                حساب کاربری نداری؟
                <a href="#">ثبت‌نام دانش‌آموز</a>
            </div>

            <!-- Back -->
            <a href="login.html" class="back-login">
                <i class="bi bi-arrow-right"></i>
                انتخاب نقش دیگر
            </a>

        </div>
    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/student-login.js"></script>

</body>

</html>
