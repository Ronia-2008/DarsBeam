<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود دانش‌آموز | درس‌بیم</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/student-login.css">

    <style>
        /* ===== همه استایل‌های قبلی اینجا ===== */
        .student-login-page {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .student-login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
        }

        .student-login-box:hover {
            box-shadow: var(--shadow-xl);
        }

        .student-logo {
            text-align: center;
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            margin-bottom: 20px;
        }

        .student-logo i {
            margin-left: 8px;
        }

        .student-login-icon {
            text-align: center;
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .student-login-box h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 4px;
        }

        .login-description {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .input-box {
            display: flex;
            align-items: center;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
            background: var(--bg-input);
        }

        .input-box:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .input-box i {
            padding: 0 12px 0 8px;
            color: var(--text-muted);
            font-size: 18px;
        }

        .input-box input {
            border: none;
            background: transparent;
            padding: 12px 8px 12px 0;
            font-size: 15px;
            width: 100%;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .login-options label {
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .login-options a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
        }

        .student-login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .student-login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .register-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 16px;
        }

        .register-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-login {
            display: block;
            text-align: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-top: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .back-login:hover {
            color: var(--primary-color);
        }

        .password-toggle {
            background: transparent;
            border: none;
            padding: 0 12px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        body.dark-theme .student-login-box {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark-theme .input-box {
            background: #0f172a;
            border-color: #334155;
        }

        body.dark-theme .input-box input {
            color: #f1f5f9;
        }

        /* ===== دکمه تنظیمات ===== */
        .settings-fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
        }

        .settings-fab button {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-fab button:hover {
            transform: rotate(60deg) scale(1.05);
            box-shadow: 0 6px 24px rgba(37, 99, 235, 0.4);
        }

        body.dark-theme .settings-fab button {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        @media (max-width: 576px) {
            .settings-fab {
                bottom: 16px;
                left: 16px;
            }
            .settings-fab button {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .student-login-box {
                padding: 24px 16px;
            }
            .student-login-icon {
                font-size: 36px;
            }
            .student-login-box h1 {
                font-size: 20px;
            }
            .login-options {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- ===== دکمه چرخ‌دنده ===== -->
    <div class="settings-fab">
        <button onclick="window.location.href='settings-page.html'">
            <i class="bi bi-gear-fill"></i>
        </button>
    </div>

    <!-- ===========================
            Student Login
    =========================== -->
    <main class="student-login-page">
        <div class="student-login-box">

            <a href="index.html" class="student-logo">
                <i class="bi bi-book-half"></i>
                DarsBeam
            </a>

            <div class="student-login-icon">
                <i class="bi bi-mortarboard"></i>
            </div>

            <h1>ورود دانش‌آموز</h1>
            <p class="login-description">به مسیر یادگیریت برگرد! 🚀</p>

            <form id="loginForm" onsubmit="handleStudentLogin(event)">
                <div class="form-group">
                    <label for="studentEmail">شماره موبایل یا ایمیل</label>
                    <div class="input-box">
                        <i class="bi bi-person"></i>
                        <input type="text" id="studentEmail" placeholder="شماره موبایل یا ایمیل" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="studentPassword">رمز عبور</label>
                    <div class="input-box">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="studentPassword" placeholder="رمز عبور" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label><input type="checkbox"> مرا به خاطر بسپار</label>
                    <a href="#">فراموشی رمز عبور؟</a>
                </div>

                <button type="submit" class="student-login-btn">
                    ورود به حساب <i class="bi bi-arrow-left"></i>
                </button>
            </form>

            <div class="register-text">
                حساب کاربری نداری؟ <a href="#">ثبت‌نام دانش‌آموز</a>
            </div>

            <a href="login.html" class="back-login">
                <i class="bi bi-arrow-right"></i> انتخاب نقش دیگر
            </a>

        </div>
    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/theme-manager.js"></script>
    <script>
        // ============================================
        // 1. تم دارک/لایت
        // ============================================
        function toggleDarkMode(isDark) {
            if (isDark) {
                document.body.classList.add('dark-theme');
                localStorage.setItem('darsbeam-theme', 'dark');
            } else {
                document.body.classList.remove('dark-theme');
                localStorage.setItem('darsbeam-theme', 'light');
            }
            // ===== ارسال رویداد به صفحات دیگه =====
            window.dispatchEvent(new Event('storage'));
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('darsbeam-theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
        }

        // ============================================
        // 2. تغییر رنگ اصلی
        // ============================================
        function changeThemeColor(color) {
            document.documentElement.style.setProperty('--primary-color', color);
            localStorage.setItem('darsbeam-color', color);
            // ===== ارسال رویداد به صفحات دیگه =====
            window.dispatchEvent(new Event('storage'));
        }

        function loadColor() {
            const savedColor = localStorage.getItem('darsbeam-color');
            if (savedColor) {
                document.documentElement.style.setProperty('--primary-color', savedColor);
            }
        }

        // ============================================
        // 3. به‌روزرسانی خودکار هنگام تغییر در صفحه دیگه
        // ============================================
        function applySettings() {
            loadTheme();
            loadColor();
            console.log('🔄 تنظیمات به‌روزرسانی شد!');
        }

        // گوش دادن به رویداد storage (وقتی صفحه دیگه تغییری میده)
        window.addEventListener('storage', function(e) {
            if (e.key === 'darsbeam-theme' || e.key === 'darsbeam-color') {
                applySettings();
                console.log('📥 تغییرات از صفحه دیگه دریافت شد!');
            }
        });

        // ============================================
        // 4. چشمک
        // ============================================
        function togglePasswordVisibility() {
            const input = document.getElementById('studentPassword');
            const icon = document.querySelector('.password-toggle i');
            if (!input) return;

            if (input.type === 'password') {
                input.type = 'text';
                if (icon) icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                if (icon) icon.className = 'bi bi-eye';
            }
        }

        // ============================================
        // 5. لاگین
        // ============================================
        function handleStudentLogin(event) {
            event.preventDefault();

            const email = document.getElementById('studentEmail').value;
            const password = document.getElementById('studentPassword').value;

            if (email.trim() === '' || password.trim() === '') {
                notifyError('❌ خطا', 'لطفاً همه‌ی فیلدها را پر کنید!');
                return;
            }

            localStorage.setItem('student_name', 'علی رضایی');
            localStorage.setItem('student_grade', 'هشتم');

            notifySuccess('✅ خوش آمدید!', 'در حال انتقال به پنل دانش‌آموز...');
            setTimeout(() => {
                window.location.href = 'student-dashboard.html';
            }, 800);
        }

        // ============================================
        // 6. بارگذاری اولیه
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            applySettings();
            console.log('🎨 تنظیمات اولیه بارگذاری شدند!');
        });
    </script>

</body>

</html>
