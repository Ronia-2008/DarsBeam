<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ورود دانش‌آموز | درس‌بیم</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Student Login CSS -->

    <link
        rel="stylesheet"
        href="css/student-login.css">

</head>


<body>


<!-- ===========================
        Student Login
=========================== -->

<main class="student-login-page">


    <div class="student-login-box">


        <!-- Logo -->

        <a
            href="index.html"
            class="student-logo">

            <i class="bi bi-book-half"></i>

            DarsBeam

        </a>


        <!-- Icon -->

        <div class="student-login-icon">

            <i class="bi bi-mortarboard"></i>

        </div>


        <!-- Title -->

        <h1>
            ورود دانش‌آموز
        </h1>

        <p class="login-description">
            به مسیر یادگیریت برگرد! 🚀
        </p>


        <!-- Form -->

        <form>


            <!-- Email / Phone -->

            <div class="form-group">

                <label for="studentEmail">
                    شماره موبایل یا ایمیل
                </label>

                <div class="input-box">

                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        id="studentEmail"
                        placeholder="شماره موبایل یا ایمیل">

                </div>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="studentPassword">
                    رمز عبور
                </label>

                <div class="input-box">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        id="studentPassword"
                        placeholder="رمز عبور">

                    <button
                        type="button"
                        class="password-toggle">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>


            <!-- Remember -->

            <div class="login-options">

                <label>

                    <input type="checkbox">

                    مرا به خاطر بسپار

                </label>


                <a href="#">
                    فراموشی رمز عبور؟
                </a>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="student-login-btn">

                ورود به حساب

                <i class="bi bi-arrow-left"></i>

            </button>


        </form>


        <!-- Register -->

        <div class="register-text">

            حساب کاربری نداری؟

            <a href="#">
                ثبت‌نام دانش‌آموز
            </a>

        </div>


        <!-- Back -->

        <a
            href="login.html"
            class="back-login">

            <i class="bi bi-arrow-right"></i>

            انتخاب نقش دیگر

        </a>


    </div>


</main>

<script src="js/student-login.js"></script>
</body>

</html>
