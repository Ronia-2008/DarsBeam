<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود دانش‌آموز | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/student-login.css">

    <style>
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        .student-login-page {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .student-login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
        }

        .student-login-box:hover {
            box-shadow: var(--shadow-xl);
        }

        .student-logo {
            text-align: center;
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            margin-bottom: 20px;
        }

        .student-logo i {
            margin-left: 8px;
        }

        .student-login-icon {
            text-align: center;
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .student-login-box h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 4px;
        }

        .login-description {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .input-box {
            display: flex;
            align-items: center;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            transition: var(--transition);
            background: var(--bg-input);
        }

        .input-box:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .input-box i {
            padding: 0 12px 0 8px;
            color: var(--text-muted);
            font-size: 18px;
        }

        .input-box input {
            border: none;
            background: transparent;
            padding: 12px 8px 12px 0;
            font-size: 15px;
            width: 100%;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .login-options label {
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .login-options label input {
            margin-left: 6px;
        }

        .login-options a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
        }

        .login-options a:hover {
            text-decoration: underline;
        }

        .student-login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .student-login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .register-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 16px;
        }

        .register-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back-login {
            display: block;
            text-align: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-top: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .back-login:hover {
            color: var(--primary-color);
        }

        body.dark-theme .student-login-box {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark-theme .input-box {
            background: #0f172a;
            border-color: #334155;
        }

        body.dark-theme .input-box input {
            color: #f1f5f9;
        }
    </style>
</head>

<body>

    <!-- لودینگ ساده -->
<div id="pageLoader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-body); z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
">
    <div style="text-align: center;">
        <i class="bi bi-book-half" style="font-size: 48px; color: var(--primary-color); animation: spin 1s linear infinite;"></i>
        <p style="margin-top: 12px; color: var(--text-secondary);">در حال بارگذاری...</p>
    </div>
</div>

<style>
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('pageLoader').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('pageLoader').style.display = 'none';
            }, 500);
        }, 500);
    });
</script>

    <!-- ===== دکمه‌ی تنظیمات ===== -->
    <div class="settings-btn-wrapper">
        <button id="settingsToggleBtn">
            <i class="bi bi-gear-fill"></i>
        </button>
    </div>

    <!-- ===== پنل تنظیمات ===== -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h4><i class="bi bi-sliders"></i> تنظیمات</h4>
            <button id="closeSettings"><i class="bi bi-x-lg"></i></button>
        </div>
        <hr>
        <div class="setting-item">
            <label for="darkMode">🌙 حالت روشن / تیره</label>
            <input type="checkbox" id="darkMode">
        </div>
        <div class="setting-item">
            <label>🎨 رنگ اصلی سایت</label>
            <div class="theme-colors">
                <button class="theme-color blue" data-color="#2563EB"></button>
                <button class="theme-color purple" data-color="#7C3AED"></button>
                <button class="theme-color green" data-color="#10B981"></button>
                <button class="theme-color orange" data-color="#F97316"></button>
            </div>
        </div>
    </div>

    <!-- ===========================
            Student Login
    =========================== -->
    <main class="student-login-page">
        <div class="student-login-box">

            <a href="index.html" class="student-logo">
                <i class="bi bi-book-half"></i>
                DarsBeam
            </a>

            <div class="student-login-icon">
                <i class="bi bi-mortarboard"></i>
            </div>

            <h1>ورود دانش‌آموز</h1>
            <p class="login-description">به مسیر یادگیریت برگرد! 🚀</p>

            <!-- ===== فرم لاگین ===== -->
            <form id="loginForm" onsubmit="handleStudentLogin(event)">
                <div class="form-group">
                    <label for="studentEmail">شماره موبایل یا ایمیل</label>
                    <div class="input-box">
                        <i class="bi bi-person"></i>
                        <input type="text" id="studentEmail" placeholder="شماره موبایل یا ایمیل" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="studentPassword">رمز عبور</label>
                    <div class="input-box">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="studentPassword" placeholder="رمز عبور">
                        <button type="button" class="password-toggle">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="login-options">
                    <label>
                        <input type="checkbox">
                        مرا به خاطر بسپار
                    </label>
                    <a href="#">فراموشی رمز عبور؟</a>
                </div>

                <button type="submit" class="student-login-btn">
                    ورود به حساب
                    <i class="bi bi-arrow-left"></i>
                </button>
            </form>

            <div class="register-text">
                حساب کاربری نداری؟
                <a href="#">ثبت‌نام دانش‌آموز</a>
            </div>

            <a href="login.html" class="back-login">
                <i class="bi bi-arrow-right"></i>
                انتخاب نقش دیگر
            </a>

        </div>
    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/student-login.js"></script>

    <script>
        // ===== تابع هندل کردن لاگین =====
        function handleStudentLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('studentEmail').value;
            const password = document.getElementById('studentPassword').value;
            
            // بررسی ساده (فقط برای نمایش)
            if (email.trim() === '' || password.trim() === '') {
                alert('لطفاً همه‌ی فیلدها را پر کنید!');
                return;
            }
            
            // ذخیره اطلاعات کاربر (برای نمایش در پنل)
            localStorage.setItem('student_name', 'علی رضایی');
            localStorage.setItem('student_grade', 'هشتم');
            
            // رفتن به پنل دانش‌آموز
            window.location.href = 'student-dashboard.html';
        }
    </script>

<script>
    function togglePassword() {
        const input = document.getElementById('studentPassword');
        const icon = document.querySelector('.password-toggle i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
</script>

</body>

</html>
