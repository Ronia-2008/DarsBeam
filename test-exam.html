<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون تستی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .exam-box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        .exam-header h1 {
            font-size: 20px;
            color: #1e293b;
        }
        .timer {
            background: #e2e8f0;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: bold;
            color: #1e293b;
        }
        .timer.warning {
            background: #fee2e2;
            color: #dc2626;
        }
        .info-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #64748b;
        }
        .info-bar span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #3b82f6;
            border-radius: 10px;
            transition: width 0.4s;
        }
        .question {
            display: none;
        }
        .question.active {
            display: block;
        }
        .question-number {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .option:hover {
            border-color: #3b82f6;
            background: #f0f7ff;
        }
        .option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
        }
        .option.selected {
            border-color: #3b82f6;
            background: #f0f7ff;
        }
        .option .label {
            font-weight: bold;
            color: #64748b;
            min-width: 28px;
        }
        .option .text {
            color: #0f172a;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-prev {
            background: #e2e8f0;
            color: #475569;
        }
        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-prev:hover:not(:disabled) {
            background: #cbd5e1;
        }
        .btn-next {
            background: #3b82f6;
            color: white;
        }
        .btn-next:hover {
            background: #2563eb;
        }
        .btn-submit {
            background: #10b981;
            color: white;
        }
        .btn-submit:hover {
            background: #059669;
        }
        .counter {
            display: flex;
            align-items: center;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
        }
        .result-box {
            display: none;
            text-align: center;
            padding: 30px 0;
        }
        .result-box.active {
            display: block;
        }
        .result-icon {
            font-size: 64px;
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
        }
        .result-score {
            font-size: 48px;
            font-weight: 900;
            color: #3b82f6;
            margin: 10px 0;
        }
        .result-details {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }
        .result-details div {
            background: #f1f5f9;
            padding: 10px 20px;
            border-radius: 12px;
        }
        .result-details .correct {
            color: #10b981;
        }
        .result-details .wrong {
            color: #ef4444;
        }
        .result-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .result-actions a, .result-actions button {
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }
        .btn-retry {
            background: #e2e8f0;
            color: #475569;
        }
        .btn-retry:hover {
            background: #cbd5e1;
        }
        .btn-dashboard {
            background: #3b82f6;
            color: white;
        }
        .btn-dashboard:hover {
            background: #2563eb;
        }
        .btn-rewards {
            background: #f59e0b;
            color: white;
        }
        .btn-rewards:hover {
            background: #d97706;
        }
        @media (max-width: 500px) {
            .exam-box { padding: 16px; }
            .question-text { font-size: 17px; }
            .actions { flex-direction: column; align-items: center; }
            .actions button { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="exam-box" id="examBox">

    <!-- ===== هدر ===== -->
    <div class="exam-header">
        <h1 id="examTitle">آزمون ریاضی</h1>
        <div class="timer" id="timerDisplay">15:00</div>
    </div>

    <!-- ===== اطلاعات ===== -->
    <div class="info-bar">
        <span>📝 <span id="totalQ">۰</span> سؤال</span>
        <span>✅ <span id="answeredQ">۰</span> پاسخ داده شده</span>
        <span>📊 <span id="difficultyText">سطح: متوسط</span></span>
    </div>

    <!-- ===== پیشرفت ===== -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>

    <!-- ===== سوالات ===== -->
    <div id="questionsContainer"></div>

    <!-- ===== دکمه‌ها ===== -->
    <div class="actions" id="actionsArea">
        <button class="btn-prev" id="prevBtn" disabled>← قبلی</button>
        <span class="counter" id="questionCounter">۱ از ۰</span>
        <button class="btn-next" id="nextBtn">بعدی →</button>
        <button class="btn-submit" id="submitBtn">✅ پایان آزمون</button>
    </div>

    <!-- ===== نتیجه ===== -->
    <div class="result-box" id="resultBox">
        <div class="result-icon" id="resultIcon">🏆</div>
        <div class="result-title" id="resultTitle">تبریک!</div>
        <div class="result-score" id="resultScore">۰%</div>
        <div class="result-details">
            <div>✅ صحیح: <span class="correct" id="resultCorrect">۰</span></div>
            <div>❌ غلط: <span class="wrong" id="resultWrong">۰</span></div>
        </div>
        <div class="result-actions">
            <button class="btn-retry" onclick="location.reload()">🔄 تلاش مجدد</button>
            <a href="student-dashboard.html" class="btn-dashboard">🏠 بازگشت به داشبورد</a>
            <a href="rewards-dashboard.html" class="btn-rewards">🏆 جوایز</a>
        </div>
    </div>

</div>

<script>
    // ============================================
    // داده‌های آزمون
    // ============================================
    const exam = {
        title: 'آزمون ریاضی فصل اول',
        difficulty: 'متوسط',
        timeLimit: 15, // دقیقه
        questions: [
            { text: '۵ × (۳ + ۲) چند است؟', options: ['۱۰', '۱۵', '۲۰', '۲۵'], correct: 3 },
            { text: 'مساحت مربع به ضلع ۴ چند است؟', options: ['۸', '۱۲', '۱۶', '۲۰'], correct: 2 },
            { text: 'کدام عدد بزرگ‌تر است؟', options: ['۰.۵', '۰.۰۵', '۰.۵۵', '۰.۵۰۵'], correct: 2 },
            { text: '۱۲ ÷ ۴ چند است؟', options: ['۲', '۳', '۴', '۶'], correct: 1 },
            { text: 'محیط مستطیل ۸ و ۵ چند است؟', options: ['۱۳', '۲۶', '۴۰', '۲۰'], correct: 1 }
        ]
    };

    // ============================================
    // متغیرها
    // ============================================
    let current = 0;
    let answers = {};
    let timerInterval;
    let timeLeft = exam.timeLimit * 60;
    let isSubmitted = false;

    // المان‌ها
    const container = document.getElementById('questionsContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const counter = document.getElementById('questionCounter');
    const progressFill = document.getElementById('progressFill');
    const timerDisplay = document.getElementById('timerDisplay');
    const totalQ = document.getElementById('totalQ');
    const answeredQ = document.getElementById('answeredQ');

    // ============================================
    // 1. مقداردهی
    // ============================================
    function init() {
        document.getElementById('examTitle').textContent = exam.title;
        document.getElementById('difficultyText').textContent = 'سطح: ' + exam.difficulty;
        totalQ.textContent = exam.questions.length;
        renderQuestions();
        showQuestion(0);
        startTimer();
        updateStats();
    }

    // ============================================
    // 2. رندر سوالات
    // ============================================
    function renderQuestions() {
        container.innerHTML = '';
        const letters = ['الف', 'ب', 'پ', 'ت'];

        exam.questions.forEach((q, index) => {
            const div = document.createElement('div');
            div.className = 'question';
            div.dataset.index = index;

            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <label class="option" data-optindex="${optIndex}">
                        <input type="radio" name="q${index}" value="${optIndex}">
                        <span class="label">${letters[optIndex]})</span>
                        <span class="text">${opt}</span>
                    </label>
                `;
            });

            div.innerHTML = `
                <div class="question-number">سؤال ${index + 1} از ${exam.questions.length}</div>
                <div class="question-text">${q.text}</div>
                <div class="options">${optionsHTML}</div>
            `;

            container.appendChild(div);

            // رویداد انتخاب گزینه
            const options = div.querySelectorAll('.option input[type="radio"]');
            options.forEach(input => {
                input.addEventListener('change', function() {
                    const value = parseInt(this.value);
                    answers[index] = value;
                    // هایلایت گزینه انتخاب شده
                    div.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                    this.closest('.option').classList.add('selected');
                    updateStats();
                });
            });
        });
    }

    // ============================================
    // 3. نمایش سوال
    // ============================================
    function showQuestion(index) {
        const cards = container.querySelectorAll('.question');
        cards.forEach((card, i) => {
            card.classList.toggle('active', i === index);
        });

        current = index;
        counter.textContent = `${index + 1} از ${exam.questions.length}`;

        prevBtn.disabled = index === 0;
        
        if (index === exam.questions.length - 1) {
            nextBtn.textContent = 'پایان';
        } else {
            nextBtn.textContent = 'بعدی →';
        }
    }

    // ============================================
    // 4. تایمر
    // ============================================
    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 60) {
                timerDisplay.classList.add('warning');
            }
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitExam(true);
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // ============================================
    // 5. آمار
    // ============================================
    function updateStats() {
        const answered = Object.keys(answers).length;
        answeredQ.textContent = answered;
        const percent = Math.round((answered / exam.questions.length) * 100);
        progressFill.style.width = percent + '%';
    }

    // ============================================
    // 6. ثبت آزمون
    // ============================================
    function submitExam(auto = false) {
        if (isSubmitted) return;

        const total = exam.questions.length;
        const answered = Object.keys(answers).length;

        if (!auto && answered < total) {
            if (!confirm(`از ${total} سؤال، فقط ${answered} تا رو پاسخ دادی. مطمئنی؟`)) {
                return;
            }
        }

        if (auto) {
            alert('⏰ زمان تمام شد! آزمون به صورت خودکار ثبت شد.');
        }

        // محاسبه نمره
        let correct = 0;
        exam.questions.forEach((q, index) => {
            if (answers[index] === q.correct) {
                correct++;
            }
        });

        const score = Math.round((correct / total) * 100);
        const passed = score >= 60;

        // ذخیره نتیجه
        const result = {
            examTitle: exam.title,
            score: score,
            correct: correct,
            total: total,
            passed: passed,
            date: new Date().toISOString()
        };

        const results = JSON.parse(localStorage.getItem('darsbeam_exam_results') || '[]');
        results.push(result);
        localStorage.setItem('darsbeam_exam_results', JSON.stringify(results));

        // ===== ثبت در سیستم جایزه (اگه وجود داشته باشه) =====
        try {
            if (typeof darsbeamRewards !== 'undefined' && darsbeamRewards) {
                darsbeamRewards.logExam({
                    examTitle: exam.title,
                    score: score,
                    totalQuestions: total,
                    correctAnswers: correct
                });
                console.log('✅ ثبت در سیستم جایزه انجام شد!');
            }
        } catch (e) {
            console.warn('⚠️ سیستم جایزه در دسترس نیست');
        }

        // نمایش نتیجه
        showResult(correct, total, score, passed);
        clearInterval(timerInterval);
        isSubmitted = true;
    }

    // ============================================
    // 7. نمایش نتیجه
    // ============================================
    function showResult(correct, total, score, passed) {
        document.getElementById('resultIcon').textContent = passed ? '🏆' : '💪';
        document.getElementById('resultTitle').textContent = passed ? '🎉 تبریک!' : '💪 تلاش خوبی بود!';
        document.getElementById('resultScore').textContent = score + '%';
        document.getElementById('resultCorrect').textContent = correct;
        document.getElementById('resultWrong').textContent = total - correct;

        // مخفی کردن سوالات و نمایش نتیجه
        document.getElementById('questionsContainer').style.display = 'none';
        document.getElementById('actionsArea').style.display = 'none';
        document.querySelector('.progress-bar').style.display = 'none';
        document.querySelector('.info-bar').style.display = 'none';
        document.querySelector('.exam-header .timer').style.display = 'none';
        document.getElementById('resultBox').classList.add('active');
    }

    // ============================================
    // 8. رویدادها
    // ============================================
    prevBtn.addEventListener('click', () => {
        if (current > 0) showQuestion(current - 1);
    });

    nextBtn.addEventListener('click', () => {
        if (current < exam.questions.length - 1) {
            showQuestion(current + 1);
        } else {
            submitExam();
        }
    });

    submitBtn.addEventListener('click', submitExam);

    // ============================================
    // 9. اجرا
    // ============================================
    init();
    console.log('✅ صفحه آزمون با موفقیت بارگذاری شد!');
</script>

</body>
</html>
