<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود معلم | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/teacher-login.css">

    <style>
        /* ===== دکمه‌ی تنظیمات ===== */
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        /* ===== هماهنگی تم با teacher-login.css ===== */
        .teacher-login-page {
            background: var(--bg-body) !important;
        }

        .teacher-login-box {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: var(--shadow-lg) !important;
        }

        .teacher-logo {
            color: var(--text-primary) !important;
        }

        .teacher-login-box h1 {
            color: var(--text-primary) !important;
        }

        .login-description {
            color: var(--text-secondary) !important;
        }

        .form-group label {
            color: var(--text-primary) !important;
        }

        .input-box {
            background: var(--bg-input) !important;
            border: 2px solid var(--border-color) !important;
        }

        .input-box input {
            color: var(--text-primary) !important;
        }

        .input-box i {
            color: var(--text-muted) !important;
        }

        .password-toggle {
            color: var(--text-muted) !important;
        }

        .password-toggle:hover {
            color: var(--text-primary) !important;
        }

        .login-options label {
            color: var(--text-secondary) !important;
        }

        .login-options a {
            color: var(--primary-color) !important;
        }

        .login-options a:hover {
            color: var(--primary-hover) !important;
        }

        .teacher-login-btn {
            background: var(--primary-color) !important;
            color: white !important;
        }

        .teacher-login-btn:hover {
            background: var(--primary-hover) !important;
        }

        .register-text {
            color: var(--text-secondary) !important;
        }

        .register-text a {
            color: var(--primary-color) !important;
        }

        .register-text a:hover {
            color: var(--primary-hover) !important;
        }

        .back-login {
            color: var(--text-secondary) !important;
        }

        .back-login:hover {
            color: var(--primary-color) !important;
        }

        /* ===== دارک مود ===== */
        body.dark-theme .teacher-login-box {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        body.dark-theme .input-box {
            background: #0f172a !important;
            border-color: #334155 !important;
        }

        body.dark-theme .input-box input {
            color: #f1f5f9 !important;
        }
    </style>
</head>

<body>
    <!-- لودینگ ساده -->
<div id="pageLoader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-body); z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
">
    <div style="text-align: center;">
        <i class="bi bi-book-half" style="font-size: 48px; color: var(--primary-color); animation: spin 1s linear infinite;"></i>
        <p style="margin-top: 12px; color: var(--text-secondary);">در حال بارگذاری...</p>
    </div>
</div>

<style>
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('pageLoader').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('pageLoader').style.display = 'none';
            }, 500);
        }, 500);
    });
</script>

    <!-- دکمه تنظیمات (چرخ‌دنده) -->
<div class="settings-btn-wrapper">
    <button onclick="toggleSettingsPanel(event)" aria-label="تنظیمات">
        <i class="bi bi-gear-fill"></i>
    </button>
</div>

<!-- پنل تنظیمات -->
<div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
        <h4><i class="bi bi-sliders"></i> تنظیمات</h4>
        <button onclick="closeSettingsPanel()" aria-label="بستن تنظیمات">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
    <hr>
    <div class="setting-item">
        <label for="darkMode">🌙 حالت روشن / تیره</label>
        <input type="checkbox" id="darkMode" onchange="toggleDarkMode(this.checked)">
    </div>
    <div class="setting-item">
        <label>🎨 رنگ اصلی سایت</label>
        <div class="theme-colors">
            <button class="theme-color blue" onclick="changeThemeColor('#2563EB')" data-color="#2563EB" aria-label="رنگ آبی"></button>
            <button class="theme-color purple" onclick="changeThemeColor('#7C3AED')" data-color="#7C3AED" aria-label="رنگ بنفش"></button>
            <button class="theme-color green" onclick="changeThemeColor('#10B981')" data-color="#10B981" aria-label="رنگ سبز"></button>
            <button class="theme-color orange" onclick="changeThemeColor('#F97316')" data-color="#F97316" aria-label="رنگ نارنجی"></button>
        </div>
    </div>
</div>

    <!-- ===========================
            Teacher Login
    =========================== -->
    <main class="teacher-login-page">
        <div class="teacher-login-box">

            <!-- Logo -->
            <a href="index.html" class="teacher-logo">
                <i class="bi bi-book-half"></i>
                DarsBeam
            </a>

            <!-- Icon -->
            <div class="teacher-login-icon">
                <i class="bi bi-person-video3"></i>
            </div>

            <!-- Title -->
            <h1>ورود معلم</h1>
            <p class="login-description">کلاس و آزمون‌هات رو مدیریت کن! 🚀</p>

            <!-- Form -->
            <form>

                <!-- Email / Phone -->
                <div class="form-group">
                    <label for="teacherEmail">شماره موبایل یا ایمیل</label>
                    <div class="input-box">
                        <i class="bi bi-person"></i>
                        <input type="text" id="teacherEmail" placeholder="شماره موبایل یا ایمیل">
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="teacherPassword">رمز عبور</label>
                    <div class="input-box">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="teacherPassword" placeholder="رمز عبور">
                        <button type="button" class="password-toggle">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Options -->
                <div class="login-options">
                    <label>
                        <input type="checkbox">
                        مرا به خاطر بسپار
                    </label>
                    <a href="#">فراموشی رمز عبور؟</a>
                </div>

                <!-- Login -->
                <button type="submit" class="teacher-login-btn">
                    ورود به پنل معلم
                    <i class="bi bi-arrow-left"></i>
                </button>

            </form>

            <!-- Register -->
            <div class="register-text">
                حساب معلم نداری؟
                <a href="#">ثبت‌نام به عنوان معلم</a>
            </div>

            <!-- Back -->
            <a href="login.html" class="back-login">
                <i class="bi bi-arrow-right"></i>
                انتخاب نقش دیگر
            </a>

        </div>
    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--<script src="js/settings.js"></script>-->
    <script src="js/teacher-login.js"></script>

    <script>
    // ============================================
    // 1. پنل تنظیمات
    // ============================================
    function toggleSettingsPanel(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        const panel = document.getElementById('settingsPanel');
        if (panel) {
            panel.classList.toggle('open');
            console.log('🔘 پنل تنظیمات باز/بسته شد');
        }
    }

    function closeSettingsPanel() {
        const panel = document.getElementById('settingsPanel');
        if (panel) {
            panel.classList.remove('open');
            console.log('🔘 پنل تنظیمات بسته شد');
        }
    }

    // ============================================
    // 2. تم دارک/لایت
    // ============================================
    function toggleDarkMode(isDark) {
        if (isDark) {
            document.body.classList.add('dark-theme');
            localStorage.setItem('darsbeam-theme', 'dark');
            console.log('🌙 دارک مود فعال شد');
        } else {
            document.body.classList.remove('dark-theme');
            localStorage.setItem('darsbeam-theme', 'light');
            console.log('☀️ لایت مود فعال شد');
        }
    }

    function loadTheme() {
        const savedTheme = localStorage.getItem('darsbeam-theme');
        const darkModeCheckbox = document.getElementById('darkMode');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            if (darkModeCheckbox) darkModeCheckbox.checked = true;
        } else {
            document.body.classList.remove('dark-theme');
            if (darkModeCheckbox) darkModeCheckbox.checked = false;
        }
        console.log('📂 تم بارگذاری شد:', savedTheme || 'light');
    }

    // ============================================
    // 3. تغییر رنگ اصلی
    // ============================================
    function changeThemeColor(color) {
        document.documentElement.style.setProperty('--primary-color', color);
        localStorage.setItem('darsbeam-color', color);
        
        // به‌روزرسانی دکمه‌های فعال
        document.querySelectorAll('.theme-color').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.color === color) {
                btn.classList.add('active');
            }
        });
        console.log('🎨 رنگ تغییر کرد به:', color);
    }

    function loadColor() {
        const savedColor = localStorage.getItem('darsbeam-color');
        if (savedColor) {
            changeThemeColor(savedColor);
        } else {
            const defaultBlue = document.querySelector('.theme-color.blue');
            if (defaultBlue) defaultBlue.classList.add('active');
        }
        console.log('🎨 رنگ بارگذاری شد:', savedColor || 'blue');
    }

    // ============================================
    // 4. چشمک (نمایش رمز) - فقط برای صفحات لاگین
    // ============================================
    function togglePasswordVisibility() {
        const input = document.getElementById('studentPassword');
        const icon = document.querySelector('.password-toggle i');
        if (!input) return;
        
        if (input.type === 'password') {
            input.type = 'text';
            if (icon) icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            if (icon) icon.className = 'bi bi-eye';
        }
    }

    // ============================================
    // 5. بارگذاری اولیه
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        loadTheme();
        loadColor();

        // بستن پنل با کلیک خارج از آن
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('settingsPanel');
            const btn = document.querySelector('.settings-btn-wrapper button');
            if (panel && panel.classList.contains('open')) {
                const isClickInside = panel.contains(e.target);
                const isClickOnBtn = btn && btn.contains(e.target);
                if (!isClickInside && !isClickOnBtn) {
                    panel.classList.remove('open');
                }
            }
        });

        // بستن پنل با کلید ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSettingsPanel();
            }
        });

        console.log('⚙️ تنظیمات با موفقیت بارگذاری شد!');
    });
</script>
</body>

</html>
