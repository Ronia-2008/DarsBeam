<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود معلم | درس‌بیم</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/teacher-login.css">
    <link rel="stylesheet" href="css/notifications.css">

    <style>
        /* ===== دکمه‌ی تنظیمات ===== */
        .settings-btn-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .settings-btn-wrapper button {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            box-shadow: var(--shadow-sm);
        }

        .settings-btn-wrapper button:hover {
            transform: rotate(60deg);
            box-shadow: var(--shadow-md);
        }

        /* ===== هماهنگی تم با teacher-login.css ===== */
        .teacher-login-page {
            background: var(--bg-body) !important;
        }

        .teacher-login-box {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: var(--shadow-lg) !important;
        }

        .teacher-logo {
            color: var(--text-primary) !important;
        }

        .teacher-login-box h1 {
            color: var(--text-primary) !important;
        }

        .login-description {
            color: var(--text-secondary) !important;
        }

        .form-group label {
            color: var(--text-primary) !important;
        }

        .input-box {
            background: var(--bg-input) !important;
            border: 2px solid var(--border-color) !important;
        }

        .input-box input {
            color: var(--text-primary) !important;
        }

        .input-box i {
            color: var(--text-muted) !important;
        }

        .password-toggle {
            color: var(--text-muted) !important;
        }

        .password-toggle:hover {
            color: var(--text-primary) !important;
        }

        .login-options label {
            color: var(--text-secondary) !important;
        }

        .login-options a {
            color: var(--primary-color) !important;
        }

        .login-options a:hover {
            color: var(--primary-hover) !important;
        }

        .teacher-login-btn {
            background: var(--primary-color) !important;
            color: white !important;
        }

        .teacher-login-btn:hover {
            background: var(--primary-hover) !important;
        }

        .register-text {
            color: var(--text-secondary) !important;
        }

        .register-text a {
            color: var(--primary-color) !important;
        }

        .register-text a:hover {
            color: var(--primary-hover) !important;
        }

        .back-login {
            color: var(--text-secondary) !important;
        }

        .back-login:hover {
            color: var(--primary-color) !important;
        }

        /* ===== دارک مود ===== */
        body.dark-theme .teacher-login-box {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        body.dark-theme .input-box {
            background: #0f172a !important;
            border-color: #334155 !important;
        }

        body.dark-theme .input-box input {
            color: #f1f5f9 !important;
        }
    </style>
</head>

<body>
    <!-- لودینگ ساده -->
<div id="pageLoader" style="
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-body); z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
">
    <div style="text-align: center;">
        <i class="bi bi-book-half" style="font-size: 48px; color: var(--primary-color); animation: spin 1s linear infinite;"></i>
        <p style="margin-top: 12px; color: var(--text-secondary);">در حال بارگذاری...</p>
    </div>
</div>

<style>
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('pageLoader').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('pageLoader').style.display = 'none';
            }, 500);
        }, 500);
    });
</script>

    <!-- ===== دکمه چرخ‌دنده (تنظیمات) ===== -->
<div class="settings-fab">
    <button onclick="window.location.href='settings-page.html'">
        <i class="bi bi-gear-fill"></i>
    </button>
</div>

<!-- استایل دکمه -->
<style>
    .settings-fab {
        position: fixed;
        bottom: 30px;
        left: 30px;
        z-index: 1000;
    }

    .settings-fab button {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--primary-color);
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .settings-fab button:hover {
        transform: rotate(60deg) scale(1.05);
        box-shadow: 0 6px 24px rgba(37, 99, 235, 0.4);
    }

    body.dark-theme .settings-fab button {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 576px) {
        .settings-fab {
            bottom: 16px;
            left: 16px;
        }
        .settings-fab button {
            width: 48px;
            height: 48px;
            font-size: 20px;
        }
    }
</style>

    <!-- ===========================
            Teacher Login
    =========================== -->
    <main class="teacher-login-page">
        <div class="teacher-login-box">

            <!-- Logo -->
            <a href="index.html" class="teacher-logo">
                <i class="bi bi-book-half"></i>
                DarsBeam
            </a>

            <!-- Icon -->
            <div class="teacher-login-icon">
                <i class="bi bi-person-video3"></i>
            </div>

            <!-- Title -->
            <h1>ورود معلم</h1>
            <p class="login-description">کلاس و آزمون‌هات رو مدیریت کن! 🚀</p>

            <!-- Form -->
            <form>

                <!-- Email / Phone -->
                <div class="form-group">
                    <label for="teacherEmail">شماره موبایل یا ایمیل</label>
                    <div class="input-box">
                        <i class="bi bi-person"></i>
                        <input type="text" id="teacherEmail" placeholder="شماره موبایل یا ایمیل">
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="teacherPassword">رمز عبور</label>
                    <div class="input-box">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="teacherPassword" placeholder="رمز عبور">
                        <button type="button" class="password-toggle">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Options -->
                <div class="login-options">
                    <label>
                        <input type="checkbox">
                        مرا به خاطر بسپار
                    </label>
                    <a href="#">فراموشی رمز عبور؟</a>
                </div>

                <!-- Login -->
                <button type="submit" class="teacher-login-btn">
                    ورود به پنل معلم
                    <i class="bi bi-arrow-left"></i>
                </button>

            </form>

            <!-- Register -->
            <div class="register-text">
                حساب معلم نداری؟
                <a href="#">ثبت‌نام به عنوان معلم</a>
            </div>

            <!-- Back -->
            <a href="login.html" class="back-login">
                <i class="bi bi-arrow-right"></i>
                انتخاب نقش دیگر
            </a>

        </div>
    </main>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--<script src="js/settings.js"></script>-->
    <script src="js/teacher-login.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/theme-manager.js"></script>

    <script>
    // ============================================
    // 1. پنل تنظیمات
    // ============================================
    function toggleSettingsPanel(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        const panel = document.getElementById('settingsPanel');
        if (panel) {
            panel.classList.toggle('open');
            console.log('🔘 پنل تنظیمات باز/بسته شد');
        }
    }

    function closeSettingsPanel() {
        const panel = document.getElementById('settingsPanel');
        if (panel) {
            panel.classList.remove('open');
            console.log('🔘 پنل تنظیمات بسته شد');
        }
    }

    // ============================================
        // 1. تم دارک/لایت
        // ============================================
        function toggleDarkMode(isDark) {
            if (isDark) {
                document.body.classList.add('dark-theme');
                localStorage.setItem('darsbeam-theme', 'dark');
            } else {
                document.body.classList.remove('dark-theme');
                localStorage.setItem('darsbeam-theme', 'light');
            }
            // ===== ارسال رویداد به صفحات دیگه =====
            window.dispatchEvent(new Event('storage'));
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('darsbeam-theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
        }

        // ============================================
        // 2. تغییر رنگ اصلی
        // ============================================
        function changeThemeColor(color) {
            document.documentElement.style.setProperty('--primary-color', color);
            localStorage.setItem('darsbeam-color', color);
            // ===== ارسال رویداد به صفحات دیگه =====
            window.dispatchEvent(new Event('storage'));
        }

        function loadColor() {
            const savedColor = localStorage.getItem('darsbeam-color');
            if (savedColor) {
                document.documentElement.style.setProperty('--primary-color', savedColor);
            }
        }

        // ============================================
        // 3. به‌روزرسانی خودکار هنگام تغییر در صفحه دیگه
        // ============================================
        function applySettings() {
            loadTheme();
            loadColor();
            console.log('🔄 تنظیمات به‌روزرسانی شد!');
        }

        // گوش دادن به رویداد storage (وقتی صفحه دیگه تغییری میده)
        window.addEventListener('storage', function(e) {
            if (e.key === 'darsbeam-theme' || e.key === 'darsbeam-color') {
                applySettings();
                console.log('📥 تغییرات از صفحه دیگه دریافت شد!');
            }
        });
        // ============================================
        // 6. بارگذاری اولیه
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            applySettings();
            console.log('🎨 تنظیمات اولیه بارگذاری شدند!');
        });
</script>
</body>

</html>
